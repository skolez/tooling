[project]
name = "content-tool"
version = "0.1.0"
description = "Ingest and categorize text/HTML/PDF content by metadata and (optional) semantics."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "langdetect>=1.0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[project.scripts]
content-tool = "content_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_tool"]
