[project]
name = "image-tool"
version = "0.1.0"
description = "Crawl, fetch, and categorize images by metadata-based parameters."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3",
    "beautifulsoup4>=4.12",
    "imagehash>=4.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
image-tool = "image_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_tool"]
